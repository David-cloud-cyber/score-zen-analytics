name = "livefoot"
main = "dist/server/index.mjs"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
SUPABASE_URL = "https://oirdlreedxhldmwadwom.supabase.co"
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yxv1dFxXbVRB4V58m1833w_MW11Uigv"
VITE_SUPABASE_URL = "https://oirdlreedxhldmwadwom.supabase.co"
VITE_SUPABASE_PUBLISHABLE_KEY = "sb_publishable_yxv1dFxXbVRB4V58m1833w_MW11Uigv"
PUBLIC_APP_URL = "https://www.livefoot.fun"

[secrets]
required = [
  "SUPABASE_SERVICE_ROLE_KEY",
  "FAPSHI_API_USER",
  "FAPSHI_API_KEY",
  "FAPSHI_WEBHOOK_SECRET",
  "OPENROUTER_API_KEY",
  "APIFOOTBALL_KEY",
]

[[kv_namespaces]]
binding = "FOOTBALL_CACHE"
id = "59705697c4c941d1b4b1e76f1b9662d7"

[[durable_objects.bindings]]
name = "LIVE_FOOTBALL_COORDINATOR"
class_name = "LiveFootballCoordinator"

[[migrations]]
tag = "v1"
new_classes = ["LiveFootballCoordinator"]

# Secrets (set via: wrangler secret put SECRET_NAME)
# APIFOOTBALL_KEY  ← wrangler secret put APIFOOTBALL_KEY

# Production secrets are managed in Cloudflare Workers settings.
[[routes]]
pattern = "www.livefoot.fun/*"
zone_name = "livefoot.fun"

[[routes]]
pattern = "livefoot.fun/*"
zone_name = "livefoot.fun"

[assets]
directory = "./dist/client"
